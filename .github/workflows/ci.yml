name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      concurrency-scope:
        description: >-
          A value unique to the calling workflow. Inside a called workflow the
          github context belongs to the caller, so a tag push would otherwise
          put the release quality gate in this workflow's own group.
        required: true
        type: string

concurrency:
  group: ci-${{ inputs.concurrency-scope || 'branch' }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Syncs must never rewrite the lockfile; only a deliberate `uv lock` may.
  UV_FROZEN: "1"

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-suffix: lint
      # The global UV_FROZEN would downgrade --check to a validity-only test.
      - name: uv lockfile is current
        run: env -u UV_FROZEN uv lock --check
      - name: yamllint
        run: pipx run yamllint --strict .
      - name: shellcheck
        run: shellcheck scripts/*.sh
      # shfmt is not preinstalled on the runner; pinned release verified
      # against a hash recorded here — mvdan/sh publishes no checksums file.
      - name: Install shfmt
        run: |
          cd "${RUNNER_TEMP}"
          curl -sSfLO https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          echo "fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1  shfmt_v3.13.1_linux_amd64" \
            | sha256sum -c -
          sudo install -m 0755 shfmt_v3.13.1_linux_amd64 /usr/local/bin/shfmt
      - name: shfmt
        run: shfmt -d -i 2 scripts/
      - name: Validate every compose combination
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.byo.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.ci.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.airgap.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.airgap.yml config -q

  meta:
    name: meta
    runs-on: ubuntu-latest
    env:
      # test_workflows.py reads main's required checks through the rules API.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-suffix: meta
      - run: uv sync --group dev
      - run: uv run pytest tests/meta

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans the full history.
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
      # The image list comes from the compose file itself, so a bump there can
      # never silently escape the scan. Blocking on CRITICAL/HIGH is the point:
      # a repo whose thesis is hardened private AI cannot ship known-bad pins.
      - name: Scan every pinned image
        run: |
          failed=0
          for image in $(docker compose config --images | sort -u); do
            echo "=== ${image}"
            trivy image --exit-code 1 --ignore-unfixed \
              --scanners vuln --pkg-types os,library \
              --severity CRITICAL,HIGH \
              --ignore-policy .trivyignore.rego \
              --format json --output "${RUNNER_TEMP}/trivy-result.json" "$image" || failed=1
            jq -r '.Results[]?.Vulnerabilities[]? | "\(.VulnerabilityID)\t\(.Severity)\t\(.PkgName)"' \
              "${RUNNER_TEMP}/trivy-result.json" | sort -u
          done
          exit "$failed"

  stack:
    name: stack
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      # The default 4B model is too heavy for a GPU-less runner; the tiny
      # model only proves the circuit, never quality (see docs, phase 5).
      GENERATION_MODEL: qwen3.5:0.8b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Report and free disk space
        run: |
          df -h /
          sudo docker system prune -af --volumes > /dev/null
          df -h /

      - name: Cache Ollama models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .ci-cache/ollama
          key: ollama-models-${{ runner.os }}-qwen3.5-0.8b-embeddinggemma-v1

      - name: Start the stack
        run: docker compose up -d

      - name: Smoke test
        run: ./scripts/smoke-test.sh

      # The Reed pipe is code in this repo: prove its installer against the
      # live stack, twice — the second run must be an idempotent refresh. The
      # first signup becomes the admin upstream, so CI signs up over the API
      # and lets the installer sign in; the documented user path (API key) is
      # what .env.example describes. Runs before the round-trip below, which
      # wipes every volume.
      - name: Install the Reed pipe (twice — idempotency)
        run: |
          curl -fsS -X POST http://127.0.0.1:3000/api/v1/auths/signup \
            -H 'content-type: application/json' \
            -d '{"name":"CI Admin","email":"ci-admin@example.com","password":"correct horse battery staple"}' \
            | jq -e .token > /dev/null
          export WEBUI_ADMIN_EMAIL=ci-admin@example.com
          export WEBUI_ADMIN_PASSWORD="correct horse battery staple"
          ./scripts/install-reed-pipe.sh
          ./scripts/install-reed-pipe.sh

      # A backup script nobody has restored from is a hope, not a backup: take
      # the pair, wipe every volume, bring the stack back and restore into it,
      # then prove the restored document still answers with citations.
      - name: Backup and restore round-trip
        run: |
          ./scripts/backup.sh ci-round-trip
          docker compose down -v
          docker compose up -d
          ./scripts/restore.sh backups/ci-round-trip
          SMOKE_SKIP_UPLOAD=1 ./scripts/smoke-test.sh

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Resource usage
        if: always()
        run: docker stats --no-stream || true

      - name: Tear down
        if: always()
        run: docker compose down -v

      # The ollama container writes the bind-mounted model store as root;
      # actions/cache runs as the runner user and must be able to tar it.
      - name: Make the model cache cacheable
        if: always()
        run: |
          test -d .ci-cache && sudo chown -R "$(id -u):$(id -g)" .ci-cache || true
          test -d backups && sudo chown -R "$(id -u):$(id -g)" backups || true

  # The air-gap guide cannot be prose alone: build the real bundle with the
  # tiny CI model set, wipe every local image and volume to simulate the
  # isolated machine, install from the bundle and smoke it with the stack's
  # NAT disabled (no container egress). The mechanism is identical to the
  # full package — only the model sizes differ.
  airgap:
    name: airgap
    runs-on: ubuntu-latest
    env:
      GENERATION_MODEL: qwen3.5:0.8b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Report and free disk space
        run: |
          df -h /
          sudo docker system prune -af --volumes > /dev/null
          df -h /

      - name: Build the offline bundle (connected phase)
        run: ./scripts/package-offline.sh dist

      - name: Verify the bundle checksum
        run: cd dist && sha256sum -c private-ai-stack-offline.tar.gz.sha256

      # The proof that the bundle is complete: nothing local survives, so
      # everything the isolated phase needs must come out of the tarball.
      - name: Simulate the isolated machine
        run: sudo docker system prune -af --volumes

      - name: Install from the bundle with no egress
        run: |
          tar xzf dist/private-ai-stack-offline.tar.gz -C dist
          cd dist/private-ai-stack-offline
          ./install.sh

      - name: Smoke test with container egress cut
        run: |
          cd dist/private-ai-stack-offline/compose
          COMPOSE_FILE=docker-compose.yml:docker-compose.airgap.yml \
            ../scripts/smoke-test.sh

      - name: Service logs on failure
        if: failure()
        run: |
          echo "=== reed /ready body (says which dependency is down)"
          curl -s http://127.0.0.1:8000/ready || true
          echo
          cd dist/private-ai-stack-offline/compose 2>/dev/null &&
            COMPOSE_FILE=docker-compose.yml:docker-compose.airgap.yml \
            docker compose logs --no-color || true

      - name: Tear down
        if: always()
        run: |
          cd dist/private-ai-stack-offline/compose 2>/dev/null &&
            COMPOSE_FILE=docker-compose.yml:docker-compose.airgap.yml \
            docker compose down -v || true

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      # Same tiny CI model as the stack job: the tests prove the circuit and
      # the UI behavior, never answer quality.
      GENERATION_MODEL: qwen3.5:0.8b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-suffix: e2e

      - name: Report and free disk space
        run: |
          df -h /
          sudo docker system prune -af --volumes > /dev/null
          df -h /

      - name: Cache Ollama models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .ci-cache/ollama
          key: ollama-models-${{ runner.os }}-qwen3.5-0.8b-embeddinggemma-v1

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for readiness
        run: |
          deadline=$((SECONDS + 600))
          while :; do
            state=$(docker compose ps -a --format json 2>/dev/null |
              jq -r 'select(.Service=="model-init") | .State' || true)
            if [ "$state" = "exited" ]; then
              break
            fi
            if ((SECONDS >= deadline)); then
              echo "model-init never finished (state: ${state:-unknown})" >&2
              exit 1
            fi
            sleep 3
          done
          curl --retry 60 --retry-delay 5 --retry-all-errors -fsS \
            http://127.0.0.1:8000/ready > /dev/null
          code=000
          for _ in $(seq 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          [ "$code" = "200" ] || { echo "open-webui never served (last: ${code})" >&2; exit 1; }

      - run: uv sync --group e2e
      - run: uv run playwright install --with-deps chromium

      # Videos on: the recordings double as failure evidence today and as the
      # source of the README demo.gif in the documentation phase.
      - name: Exercise both UIs
        run: uv run pytest tests/e2e --video on --output test-results

      - name: Upload E2E recordings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: e2e-recordings
          path: test-results/
          if-no-files-found: ignore

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

      - name: Make the model cache cacheable
        if: always()
        run: test -d .ci-cache && sudo chown -R "$(id -u):$(id -g)" .ci-cache || true
