# CI-only override: bind-mount the Ollama model store so GitHub Actions can
# cache it between runs (actions/cache cannot reach into a named volume).
# Not for regular use — the base file's named volume is the supported setup.

services:
  ollama:
    volumes:
      - ./.ci-cache/ollama:/root/.ollama

  reed:
    environment:
      # The CI runner shares 4 vCPUs with a browser: cold 0.8b generation
      # exceeds Reed's calibrated 120 s provider timeout and /v1/ask answers
      # 502 (reed.rag.chain logs httpx.ReadTimeout). CI proves the circuit,
      # so CI widens the knob; production keeps Reed's default.
      REED_PROVIDER_TIMEOUT_SECONDS: "240"
