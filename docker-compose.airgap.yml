# Air-gap override: run the stack on a machine with no internet access.
# Images and models arrive via the bundle built by scripts/package-offline.sh
# on a connected machine — see docs/air-gap.md for the full procedure.
#
#   docker compose -f docker-compose.yml -f docker-compose.airgap.yml up -d
#
# The egress cut is a disabled masquerade, not an `internal: true` network:
# an internal network also kills the published loopback ports, and then the
# UIs are unreachable from the host — which is the whole point of the stack.
# With NAT off, container packets have no route beyond the host: services
# resolve each other and the published ports work, but nothing can leave.
# (On a genuinely isolated machine there is no upstream anyway; this makes
# the property hold even on a connected one, which is what CI proves.)

services:
  # There is no registry to pull from: model-init becomes a loud check that
  # the bundle pre-loaded every model the configuration expects.
  model-init:
    pull_policy: never
    command:
      - |
        set -e
        for model in "$$GENERATION_MODEL" "$$EMBEDDING_MODEL"; do
          echo "checking $$model"
          ollama show "$$model" > /dev/null
        done

  ollama:
    pull_policy: never

  qdrant:
    pull_policy: never

  reed:
    pull_policy: never

  open-webui:
    pull_policy: never

networks:
  default:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
